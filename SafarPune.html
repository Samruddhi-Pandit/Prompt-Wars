<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SafarPune</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF1F3;--card:#fff;--ink:#14222E;--mute:#5B6B78;--line:#D5DDE2;--teal:#0F7B7B;--amber:#D99A00;--red:#C8402F;--green:#2E8B57;--land:#E3E9EC;--water:#A9CFE0;--road:#fff;--park:#CBE3D0;--lbl:#7C8C98;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E181F;--card:#17252E;--ink:#E6EEF2;--mute:#9AAAB5;--line:#2A3B46;--land:#1B2A33;--water:#1F4960;--road:#2C3E49;--park:#1F3A2E;--lbl:#7F919D}}
:root[data-theme="dark"]{--bg:#0E181F;--card:#17252E;--ink:#E6EEF2;--mute:#9AAAB5;--line:#2A3B46;--land:#1B2A33;--water:#1F4960;--road:#2C3E49;--park:#1F3A2E;--lbl:#7F919D}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "Bricolage Grotesque",system-ui,-apple-system,Segoe UI,sans-serif}
header{display:flex;align-items:center;gap:16px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:700;font-size:20px;letter-spacing:-.02em}.brand span{color:var(--teal)}
nav{display:flex;gap:4px;overflow-x:auto;max-width:100%}
nav button{border:0;background:none;color:var(--mute);font:inherit;font-weight:500;padding:8px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
nav button[aria-current=true]{background:var(--teal);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
#strip{display:flex;gap:18px;padding:8px 16px;font-size:13px;color:var(--mute);overflow-x:auto;white-space:nowrap;border-bottom:1px solid var(--line)}
#strip b{color:var(--ink)}
main{display:grid;grid-template-columns:390px 1fr;height:calc(100vh - 105px);min-height:560px}
main.wide{grid-template-columns:1fr}main.wide #mapwrap{display:none}
#side{overflow-y:auto;padding:16px;border-right:1px solid var(--line)}
#mapwrap{position:relative;min-height:0}
#map{width:100%;height:100%;display:block;background:var(--land);touch-action:manipulation}
#time{position:absolute;left:12px;right:12px;bottom:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;display:flex;gap:12px;align-items:center;font-size:13px}
#time input{flex:1}
h2{font-size:20px;margin:0 0 4px;letter-spacing:-.01em}h3{font-size:15px;margin:16px 0 6px}
.sub{color:var(--mute);margin:0 0 12px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:5px 11px;border-radius:99px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input[type=text],select,textarea{width:100%;font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.item{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:8px;cursor:pointer;width:100%;text-align:left;font:inherit;color:inherit}
.item:hover{border-color:var(--teal)}
.dot{width:28px;height:28px;border-radius:50%;color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.grow{flex:1;min-width:0}.nm{font-weight:600}.mt{font-size:12.5px;color:var(--mute)}
.badge{font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;color:#fff;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.bar{display:flex;align-items:center;gap:8px;font-size:13px;margin:5px 0}.bar span:first-child{width:96px;color:var(--mute)}
.bar i{flex:1;height:7px;background:var(--line);border-radius:4px;overflow:hidden}.bar i b{display:block;height:100%}
.bar em{width:28px;text-align:right;font-style:normal;font-weight:600}
.btn{border:0;background:var(--teal);color:#fff;font:inherit;font-weight:600;padding:9px 14px;border-radius:8px;cursor:pointer}
.btn.ghost{background:none;color:var(--teal);border:1px solid var(--teal)}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left}
.cmpwrap{overflow-x:auto;max-width:900px}
.win{background:color-mix(in srgb,var(--green) 18%,transparent);font-weight:600}
.warn{color:var(--red);font-size:13px;margin:3px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;display:none;z-index:9}
.legend{position:absolute;top:10px;left:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12px;color:var(--mute)}
.pt{cursor:pointer}.lang{margin-left:auto;width:auto;padding:6px 8px}.ai{white-space:pre-wrap;font-size:14px;margin:8px 0}.hero{padding:24px 0 16px;max-width:760px}.hero h1{font-size:clamp(34px,6vw,56px);line-height:1.05;letter-spacing:-.03em;margin:8px 0 12px}.hero p{font-size:18px;color:var(--mute);max-width:560px;margin:0 0 18px}.snap,.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;max-width:1000px;margin-bottom:14px}.fcard{text-align:left;font:inherit;color:inherit;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}.fcard:hover{border-color:var(--teal)}.fcard b{display:block;margin-bottom:2px}.brand{cursor:pointer}
@media(max-width:860px){main{grid-template-columns:1fr;grid-template-rows:56vh auto;height:auto}#mapwrap{order:-1}#side{border-right:0;overflow:visible}main.wide{grid-template-rows:auto}}
@media(prefers-reduced-motion:no-preference){.card,.item{transition:border-color .15s}}
</style></head><body>
<header><div class="brand">Safar<span>Pune</span></div>
<nav id="nav"></nav><select id="lang" class="lang" aria-label="Language"><option value="en">English</option><option value="hi">हिन्दी</option><option value="mr">मराठी</option></select></header>
<div id="strip"></div>
<main id="main"><section id="side" aria-live="polite"></section>
<section id="mapwrap"><svg id="map" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Stylised map of Pune"></svg>
<div class="legend" id="legend"></div>
<div id="time"><label for="hr" style="margin:0">Time of day</label><input id="hr" type="range" min="0" max="23" value="12"><b id="hrl"></b></div></section></main>
<div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const CAT={food:{l:'Food',c:'#E07B00',s:'F'},hotel:{l:'Stays',c:'#5B5BD6',s:'B'},sight:{l:'Sights',c:'#0F7B7B',s:'A'},heritage:{l:'Heritage',c:'#8A4FB3',s:'H'}};
const CRIT=['Safety','Cleanliness','Affordability','Ratings','Accessibility'];
// scores: safety, cleanliness, affordability, ratings, accessibility (0-100). SAMPLE DATA for demo.
const P=[
{id:'shaniwar',n:'Shaniwar Wada',c:'heritage',x:50,y:49,p:1,s:[70,66,95,86,78],st:'Seat of Peshwa power, begun in 1732. A fire in 1828 destroyed the wooden interiors; the stone fort walls and gates remain.'},
{id:'aga',n:'Aga Khan Palace',c:'heritage',x:71,y:30,p:1,s:[80,85,90,88,72],st:'Built in 1892. Mahatma Gandhi and Kasturba Gandhi were detained here in the 1940s; it now holds a memorial and museum.'},
{id:'patal',n:'Pataleshwar Cave Temple',c:'heritage',x:44,y:48,p:1,s:[74,72,98,78,85],st:'An 8th-century rock-cut Shiva temple carved from a single basalt outcrop, tucked in the middle of busy JM Road.'},
{id:'sinhagad',n:'Sinhagad Fort',c:'heritage',x:18,y:90,p:1,s:[66,62,92,90,45],st:'Hill fort linked to Tanaji Malusare and the 1670 battle. Go early; the ghat road is slippery in rain.'},
{id:'dagdu',n:'Dagdusheth Halwai Ganpati',c:'heritage',x:51,y:53,p:1,s:[72,70,92,92,80],st:'A famous Ganesh temple whose Ganeshotsav celebrations are among the biggest in the city.'},
{id:'okayama',n:'Pune-Okayama Friendship Garden',c:'sight',x:40,y:70,p:1,s:[82,90,90,84,80],st:'A Japanese-style garden along the Mutha river, good for a calm evening walk.'},
{id:'osho',n:'Osho Teerth Park',c:'sight',x:68,y:47,p:2,s:[84,88,70,82,82],st:'A quiet landscaped park in Koregaon Park, popular with joggers and bird watchers.'},
{id:'parvati',n:'Parvati Hill',c:'sight',x:54,y:72,p:1,s:[68,70,95,85,50],st:'Hilltop temple complex with a city view and about 100 steps. Best at sunrise.'},
{id:'vaishali',n:'Vaishali (FC Road)',c:'food',x:40,y:45,p:2,s:[74,80,72,90,88],st:'A student-favourite South Indian restaurant on FC Road.'},
{id:'goodluck',n:'Cafe Goodluck',c:'food',x:38,y:52,p:1,s:[76,78,88,91,90],st:'An old Deccan Irani cafe known for bun maska and chai.'},
{id:'bedekar',n:'Bedekar Misal',c:'food',x:49,y:55,p:1,s:[70,68,95,89,75],st:'A Narayan Peth stop for Puneri misal pav at budget prices.'},
{id:'chitale',n:'Chitale Bandhu',c:'food',x:50,y:57,p:1,s:[72,82,85,90,80],st:'Famous for bakarwadi and Maharashtrian sweets.'},
{id:'dorabjee',n:'Dorabjee & Sons',c:'food',x:62,y:58,p:2,s:[76,80,70,84,85],st:'A Parsi-run Camp institution for berry pulao and cakes.'},
{id:'shreyas',n:'Shreyas (Apte Road)',c:'food',x:41,y:49,p:1,pr:250,k:'Meals',s:[76,82,70,88,86],st:'Maharashtrian veg thali restaurant near Deccan.'},
{id:'wadeshwar',n:'Wadeshwar (FC Road)',c:'food',x:42,y:42,p:1,pr:200,k:'Meals',s:[75,80,80,88,88],st:'Vegetarian Maharashtrian meals on FC Road, popular with students.'},
{id:'roopali',n:'Roopali (FC Road)',c:'food',x:39,y:47,p:1,pr:120,k:'Breakfast',s:[75,78,88,86,88],st:'South Indian breakfast spot: idli, dosa and filter coffee.'},
{id:'kayani',n:'Kayani Bakery (Camp)',c:'food',x:61,y:59,p:1,pr:80,k:'Sweets',s:[76,82,92,90,85],st:'Camp bakery famous for Shrewsbury biscuits.'},
{id:'sujata',n:'Sujata Mastani (Sadashiv Peth)',c:'food',x:47,y:54,p:1,pr:120,k:'Sweets',s:[72,76,86,89,78],st:'Known for mastani, a thick Pune milkshake topped with ice cream.'},
{id:'vadapav',n:'Vada pav stalls, Deccan',c:'food',x:36,y:50,p:1,pr:30,k:'Snacks',s:[70,60,98,80,92],st:'Street-side vada pav and tea, the cheapest bite in town. Pick busy stalls with fresh frying.'},
{id:'stationlodge',n:'Station-side budget lodge',c:'hotel',x:58,y:53,p:1,s:[52,50,92,60,92],st:'Cheap and next to the railway station, but the area feels edgy late at night.'},
{id:'kpboutique',n:'Koregaon Park boutique stay',c:'hotel',x:69,y:45,p:3,s:[86,90,35,88,85],st:'Quiet tree-lined lanes, cafes within walking distance. Premium prices.'},
{id:'camphotel',n:'Camp mid-range stay',c:'hotel',x:62,y:61,p:2,s:[80,80,65,80,86],st:'Walkable to MG Road and Camp eateries; balanced price and comfort.'},
{id:'swargatelodge',n:'Swargate budget lodge',c:'hotel',x:52,y:67,p:1,s:[48,52,93,58,88],st:'Next to the bus terminal; convenient but crowded and noisy.'}];
const EX={vaishali:[200,'Meals'],goodluck:[150,'Breakfast'],bedekar:[120,'Snacks'],chitale:[100,'Sweets'],dorabjee:[350,'Meals']};
P.forEach(p=>{if(EX[p.id]){p.pr=EX[p.id][0];p.k=EX[p.id][1]}});
const EF=()=>P.filter(p=>p.c==='food'&&p.pr<=S.emax&&(S.ek==='all'||p.k===S.ek)).sort((a,b)=>a.pr-b.pr);
const eatList=()=>{const l=EF();return l.length?l.map(p=>`<button class="item" data-id="${p.id}"><span class="dot" style="background:${CAT[p.c].c}">${CAT[p.c].s}</span><span class="grow"><span class="nm">${p.n}</span><br><span class="mt">${p.k} · about ₹${p.pr} per person</span><br><span class="mt">${p.st}</span></span><span class="badge" style="background:${col(pS(p,S.hr))}">Safety ${pS(p,S.hr)}</span></button>`).join(''):'<p class="sub">No places under this budget. Raise the limit.</p>'};
// risk hotspots (SAMPLE DATA): t = when it peaks
const H=[
{x:52,y:68,r:6,w:.8,t:'night',n:'Swargate bus stand: pickpocketing, poor lighting'},
{x:58,y:51,r:5,w:.7,t:'night',n:'Pune station area: late-night harassment reports'},
{x:50,y:92,r:7,w:.9,t:'rush',n:'Katraj ghat: accident-prone curves'},
{x:18,y:52,r:6,w:.8,t:'rush',n:'Chandni Chowk: frequent collisions'},
{x:86,y:68,r:7,w:.7,t:'rush',n:'Hadapsar, Solapur Rd: heavy trucks'},
{x:78,y:38,r:6,w:.6,t:'rush',n:'Nagar Rd, Kalyani Nagar: congestion crashes'},
{x:14,y:24,r:7,w:.6,t:'rush',n:'Hinjewadi bridge: gridlock'},
{x:80,y:52,r:5,w:.6,t:'night',n:'Mundhwa stretch: dark road, snatching'},
{x:40,y:51,r:4,w:.5,t:'rush',n:'Deccan, Lakdi Pul: jam and crossings'}];
let R=[];try{R=JSON.parse(localStorage.getItem('cp_reports')||'[]')}catch(e){}
const S={v:'home',cat:'all',budget:false,q:'',sel:null,hr:new Date().getHours(),cmp:['shaniwar','dagdu'],pri:'Balanced',from:'stationlodge',to:'aga',pin:null,lang:'en',walk:'peth',ai:{},ek:'all',emax:300};
const hot=()=>H.concat(R.map(r=>({x:r.x,y:r.y,r:6,w:r.ok?.85:.5,t:'all',n:r.cat+' (citizen report'+(r.ok?', verified cluster':', unverified')+'): '+r.d,u:1,ok:r.ok})));
const inten=(h,hr)=>h.t==='night'?h.w*((hr>=20||hr<5)?1:.2):h.t==='rush'?h.w*(((hr>=8&&hr<=11)||(hr>=17&&hr<=21))?1:.25):h.w*.7;
const expo=(x,y,hr,hs=hot())=>hs.reduce((a,h)=>a+inten(h,hr)*Math.exp(-Math.pow(Math.hypot(h.x-x,h.y-y)/h.r,2)),0);
const pS=(p,hr)=>clamp(Math.round(p.s[0]-40*expo(p.x,p.y,hr)),5,99);
const sc=(p,hr)=>[pS(p,hr),...p.s.slice(1)];
const col=v=>v>=75?'var(--green)':v>=55?'var(--amber)':'var(--red)';
const fmt=h=>(h%12||12)+(h<12?' AM':' PM');
const byId=id=>P.find(p=>p.id===id);
const rupee=n=>'₹'.repeat(n);
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2800)}

// nav
const VIEWS=[['home','Home'],['explore','Explore'],['safety','Safety'],['compare','Compare'],['route','Safer route'],['culture','Heritage walks'],['eat','Where to eat'],['report','Report']];
const T={hi:{'Home':'होम','Start exploring':'एक्सप्लोर शुरू करें','Know before you go':'जाने से पहले जानें','Where to eat':'कहाँ खाएँ','Explore':'एक्सप्लोर','Safety':'सुरक्षा','Compare':'तुलना','Safer route':'सुरक्षित मार्ग','Heritage walks':'विरासत यात्राएँ','Report':'रिपोर्ट','Explore Pune':'पुणे एक्सप्लोर करें','Safety map':'सुरक्षा नक्शा','Compare places':'जगहों की तुलना','Report an issue':'समस्या दर्ज करें','Add to compare':'तुलना में जोड़ें','Route here':'यहाँ का रास्ता','The story':'इतिहास','Close':'बंद करें','Smart summary':'स्मार्ट सारांश','Narrate this walk':'यात्रा का विवरण सुनाएँ','Submit report':'रिपोर्ट भेजें'},
mr:{'Home':'मुख्यपृष्ठ','Start exploring':'शोधायला सुरुवात करा','Know before you go':'जाण्यापूर्वी जाणून घ्या','Where to eat':'कुठे खावे','Explore':'शोधा','Safety':'सुरक्षा','Compare':'तुलना','Safer route':'सुरक्षित मार्ग','Heritage walks':'वारसा फेरी','Report':'तक्रार','Explore Pune':'पुणे शोधा','Safety map':'सुरक्षा नकाशा','Compare places':'ठिकाणांची तुलना','Report an issue':'समस्या नोंदवा','Add to compare':'तुलनेत जोडा','Route here':'येथे मार्ग','The story':'इतिहास','Close':'बंद करा','Smart summary':'स्मार्ट सारांश','Narrate this walk':'फेरीचे वर्णन ऐका','Submit report':'तक्रार पाठवा'}};
const t=k=>(T[S.lang]||{})[k]||k;
const WALKS=[{id:'peth',n:'Old Pune peth walk',d:'From a cave temple to the sweet shops of the old city.',s:['patal','shaniwar','dagdu','bedekar','chitale']},{id:'palace',n:'Palace to park trail',d:'From the Aga Khan Palace to quiet Koregaon Park.',s:['aga','osho','dorabjee']},{id:'taste',n:'Misal and sweets trail',d:'Five classic Pune eateries.',s:['goodluck','vaishali','bedekar','chitale','dorabjee']}];
const WK=()=>{const w=WALKS.find(x=>x.id===S.walk)||WALKS[0],stops=w.s.map(byId);let km=0;stops.forEach((p,i)=>{if(i)km+=Math.hypot(p.x-stops[i-1].x,p.y-stops[i-1].y)*.27*1.25});return{w,stops,km,min:Math.round(km/4.5*60)}};

$('#nav').onclick=e=>{const b=e.target.closest('button');if(b){S.v=b.dataset.v;render()}};

// weather & traffic strip (sample values; swap in OpenWeather/TomTom with a backend)
function strip(){const hr=S.hr,temp=Math.round(27+5*Math.sin((hr-9)/24*6.283)),rain=hr>=15&&hr<=19;
const tr=((hr>=8&&hr<=11)||(hr>=17&&hr<=21))?'Heavy':hr>=22||hr<6?'Light':'Moderate';
$('#strip').innerHTML=`<span><b>${temp}°C</b> ${rain?'Rain likely':'Mostly clear'}</span><span>Traffic: <b style="color:${tr==='Heavy'?'var(--red)':'inherit'}">${tr}</b></span>`+(rain?'<span style="color:var(--amber)">Alert: wet roads near Katraj and Sinhagad ghats</span>':'')+'<span>Sample data for ' + fmt(hr) + '</span>'}

// route maths
function curve(a,b,off){const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,cx=(a.x+b.x)/2-dy/L*off,cy=(a.y+b.y)/2+dx/L*off,pts=[];
for(let i=0;i<=24;i++){const t=i/24,u=1-t;pts.push([u*u*a.x+2*u*t*cx+t*t*b.x,u*u*a.y+2*u*t*cy+t*t*b.y])}return pts}
function evalPath(pts,hr,hs){let len=0,ex=0;pts.forEach((p,i)=>{if(i)len+=Math.hypot(p[0]-pts[i-1][0],p[1]-pts[i-1][1]);ex+=expo(p[0],p[1],hr,hs)});
len*=.27*1.25;ex=ex/pts.length;const sp=((hr>=8&&hr<=11)||(hr>=17&&hr<=21))?20:28;
const warn=hs.filter(h=>pts.some(p=>Math.hypot(p[0]-h.x,p[1]-h.y)<h.r*.9)&&inten(h,hr)>.4).map(h=>h.n);
return{len,ex,min:Math.round(len/sp*60),warn,pts,risk:clamp(Math.round(ex*60),0,100)}}
function routes(){const a=byId(S.from),b=byId(S.to),hs=hot();if(!a||!b||a===b)return null;
const fast=evalPath(curve(a,b,0),S.hr,hs);let best=null;
for(let o=-26;o<=26;o+=4){const r=evalPath(curve(a,b,o),S.hr,hs);r.cost=r.ex*45+r.len;if(!best||r.cost<best.cost)best=r}
return{fast,safe:best,same:best.pts===fast.pts||Math.abs(best.risk-fast.risk)<3}}

// map
function pinXY(h,i){return h}
function drawMap(){const v=S.v,hs=hot(),hr=S.hr;let s=`<defs><radialGradient id="g"><stop offset="0" stop-color="#C8402F" stop-opacity=".95"/><stop offset="1" stop-color="#C8402F" stop-opacity="0"/></radialGradient></defs>`;
s+=`<ellipse cx="68" cy="47" rx="5" ry="3" fill="var(--park)"/><ellipse cx="40" cy="70" rx="5" ry="3" fill="var(--park)"/><ellipse cx="54" cy="73" rx="4" ry="4" fill="var(--park)"/><ellipse cx="20" cy="90" rx="9" ry="6" fill="var(--park)"/>`;

[['Hinjewadi',8,19],['Kothrud',22,60],['Deccan',33,41],['Camp',65,66],['Koregaon Park',72,53],['Viman Nagar',82,24],['Hadapsar',84,75],['Katraj',54,95]].forEach(a=>s+=`<text x="${a[1]}" y="${a[2]}" font-size="2.2" fill="var(--lbl)">${a[0]}</text>`);

list.forEach(p=>{const c=CAT[p.c],sel=S.sel===p.id,op=v==='explore'||v==='route'||v==='culture'||v==='eat'?1:.45;
s+=`<g class="pt" data-id="${p.id}" opacity="${op}"><circle cx="${p.x}" cy="${p.y}" r="${sel?2.8:2.1}" fill="${c.c}" stroke="#fff" stroke-width=".5"/><text x="${p.x}" y="${p.y+.9}" font-size="2.3" font-weight="700" fill="#fff" text-anchor="middle">${c.s}</text><title>${esc(p.n)}</title></g>`});

if(S.pin)s+=`<path d="M${S.pin.x} ${S.pin.y}l-2-4.5a2.4 2.4 0 1 1 4 0z" fill="#8A4FB3" stroke="#fff" stroke-width=".4"/>`;

function bars(sv){return sv.map((v,i)=>`<div class="bar"><span>${CRIT[i]}</span><i><b style="width:${v}%;background:${col(v)}"></b></i><em>${v}</em></div>`).join('')}
function summary(p){const sv=sc(p,S.hr),n=sv.slice(1).concat(sv[0]),idx=sv.map((v,i)=>[v,i]).sort((a,b)=>b[0]-a[0]);
const night=pS(p,22),day=pS(p,14);return `${p.n} stands out for ${CRIT[idx[0][1]].toLowerCase()} (${idx[0][0]}) but is weakest on ${CRIT[idx[4][1]].toLowerCase()} (${idx[4][0]}). `+(day-night>=8?`Safety drops after dark (${day} at 2 PM, ${night} at 10 PM).`:'Safety stays steady through the day.')}
function listHTML(){const l=P.filter(p=>(S.cat==='all'||p.c===S.cat)&&(!S.budget||p.p===1)&&p.n.toLowerCase().includes(S.q));

function detail(){const p=byId(S.sel);if(!p)return'';return `<div class="card"><div style="display:flex;justify-content:space-between;gap:8px"><div><h2>${p.n}</h2><div class="mt">${CAT[p.c].l} · ${rupee(p.p)}</div></div><button class="chip" data-act="close">${t('Close')}</button></div>
<p>${summary(p)}</p><button class="btn ghost" data-act="ai" data-kind="place" data-id="${p.id}">✨ ${t('Smart summary')}</button><div class="ai" id="ai">${S.ai[p.id+S.lang+S.hr]||''}</div>${bars(sc(p,S.hr))}<h3>${t('The story')}</h3><p class="sub">${p.st}</p>
<button class="btn" data-act="addcmp" data-id="${p.id}">${t('Add to compare')}</button> <button class="btn ghost" data-act="routeto" data-id="${p.id}">${t('Route here')}</button></div>`}
const PANEL={
explore(){return `<h2>${t('Explore Pune')}</h2><p class="sub">Food, stays, sights and heritage, each with a time-aware safety score.</p>
<input type="text" id="q" placeholder="Search places" value="${esc(S.q)}" aria-label="Search places">
<div class="chips">${['all',...Object.keys(CAT)].map(k=>`<button class="chip ${S.cat===k?'on':''}" data-act="cat" data-k="${k}">${k==='all'?'All':CAT[k].l}</button>`).join('')}<button class="chip ${S.budget?'on':''}" data-act="budget">Budget only</button></div>${detail()}<div id="list">${listHTML()}</div>`},
safety(){const hs=hot().map(h=>({h,i:inten(h,S.hr)})).sort((a,b)=>b.i-a.i);
return `<h2>${t('Safety map')}</h2><p class="sub">Showing risk at <b>${fmt(S.hr)}</b>. Drag the time slider on the map. Night risks fade in after 8 PM; accident zones peak at rush hour.</p>
<h3>Highest risk right now</h3>`+hs.slice(0,6).map(({h,i})=>`<div class="card" style="padding:10px"><span class="badge" style="background:${col(100-i*100)}">${Math.round(i*100)}</span> ${h.u?'<span class="mt">Citizen report: </span>':''}${esc(h.n)}</div>`).join('')+`<p class="mt">Hotspots are sample data for the demo. Citizen reports you add are included automatically.</p>`},
compare(){const sel=S.cmp.map(byId).filter(Boolean),opts=id=>P.map(p=>`<option value="${p.id}" ${p.id===id?'selected':''}>${p.n}</option>`).join('');
const W={Balanced:[1,1,1,1,1],'Safety first':[3,1,1,1,1],'Budget':[1,1,3,1,1],'Accessible':[1,1,1,1,3]}[S.pri],tot=W.reduce((a,b)=>a+b),
sv=sel.map(p=>sc(p,S.hr)),ov=sv.map(a=>Math.round(a.reduce((x,v,i)=>x+v*W[i],0)/tot));
const top=ov.indexOf(Math.max(...ov)),win=CRIT.map((c,i)=>Math.max(...sv.map(a=>a[i])));
let verdict='';if(sel.length>1){const w=sel[top],ben=CRIT.filter((c,i)=>sv[top][i]===win[i]).map(c=>c.toLowerCase());verdict=`<div class="card"><b>Verdict (${S.pri.toLowerCase()}, ${fmt(S.hr)}):</b> ${w.n} comes out ahead with ${ov[top]}/100${ben.length?`, leading on ${ben.join(', ')}`:''}.</div>`}
return `<div style="max-width:900px"><h2>${t('Compare places')}</h2><p class="sub">Pick up to three places. Safety uses the time on the slider (${fmt(S.hr)}); change it below.</p>
<div class="two" style="grid-template-columns:repeat(3,1fr)">${[0,1,2].map(i=>`<select data-act="pick" data-i="${i}" aria-label="Place ${i+1}"><option value="">None</option>${opts(S.cmp[i])}</select>`).join('')}</div>
<div class="chips">${Object.keys({Balanced:1,'Safety first':1,Budget:1,Accessible:1}).map(k=>`<button class="chip ${S.pri===k?'on':''}" data-act="pri" data-k="${k}">${k}</button>`).join('')}</div>
<label for="hr2">Time of day: ${fmt(S.hr)}</label><input type="range" id="hr2" min="0" max="23" value="${S.hr}" style="width:100%">
${sel.length?`<div class="card cmpwrap" style="margin-top:12px"><table><tr><th></th>${sel.map(p=>`<th>${p.n}</th>`).join('')}</tr>
${CRIT.map((c,i)=>`<tr><td>${c}</td>${sv.map(a=>`<td class="${a[i]===win[i]&&sel.length>1?'win':''}">${a[i]}</td>`).join('')}</tr>`).join('')}
<tr><td><b>Overall</b></td>${ov.map((o,i)=>`<td class="${i===top&&sel.length>1?'win':''}"><b>${o}</b></td>`).join('')}</tr></table></div>${verdict}`:'<p class="sub">Choose at least one place.</p>'}</div>`},
route(){const r=routes(),opts=id=>P.map(p=>`<option value="${p.id}" ${p.id===id?'selected':''}>${p.n}</option>`).join('');
const card=(t,x,c)=>`<div class="card" style="border-left:4px solid ${c}"><b>${t}</b><div class="two" style="margin-top:6px"><div>${x.len.toFixed(1)} km<br><span class="mt">${x.min} min</span></div><div><span class="badge" style="background:${col(100-x.risk)}">Risk ${x.risk}</span></div></div>${x.warn.map(w=>`<div class="warn">⚠ ${esc(w)}</div>`).join('')||'<div class="mt">No known hotspots on this path.</div>'}</div>`;
return `<h2>${t('Safer route')}</h2><p class="sub">Compares the direct path with a detour that avoids risk at <b>${fmt(S.hr)}</b>.</p>
<label for="rf">From</label><select id="rf" data-act="from">${opts(S.from)}</select><label for="rt">To</label><select id="rt" data-act="to">${opts(S.to)}</select><div style="height:12px"></div>`+
(r?card('Fastest',r.fast,'#6B7B88')+(r.same?'<p class="sub">The fastest route is also about as safe as it gets at this hour.</p>':card('Safest',r.safe,'#0F7B7B')+`<p class="sub">Safest saves ${Math.max(0,r.fast.risk-r.safe.risk)} risk points for ${Math.max(0,r.safe.min-r.fast.min)} extra min.</p>`):'<p class="sub">Choose two different places.</p>')},
home(){const best=P.map(p=>[p,pS(p,S.hr)]).sort((a,b)=>b[1]-a[1])[0],risk=hot().map(h=>[h,inten(h,S.hr)]).sort((a,b)=>b[1]-a[1])[0],cheap=P.filter(p=>p.c==='food').sort((a,b)=>a.pr-b.pr)[0];
const F=[['explore','Explore','Food, stays, sights and heritage, each with a safety score.'],['safety','Safety map','Watch risky areas change from day to night.'],['compare','Compare places','Put two or three places side by side.'],['route','Safer route','The fastest way versus the safest way.'],['culture','Heritage walks','Trails with the story at every stop.'],['eat','Where to eat','Cheap eats, cheapest first.'],['report','Report an issue','Add what you see to the map.']];
return `<div class="hero"><svg viewBox="0 0 200 24" width="160" height="20" aria-hidden="true"><polyline points="0,12 50,12 62,2 74,22 86,12 200,12" fill="none" stroke="var(--teal)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg><h1>${t('Know before you go')}</h1><p>Maps tell you where things are. SafarPune tells you whether to go, when, and how safely, across Pune.</p><button class="btn" data-act="go" data-k="explore">${t('Start exploring')}</button></div>
<div class="snap"><div class="card"><span class="mt">Safest place at ${fmt(S.hr)}</span><br><b>${best[0].n}</b><span class="badge" style="background:${col(best[1])}">Safety ${best[1]}</span></div><div class="card"><span class="mt">Biggest risk at ${fmt(S.hr)}</span><br><b style="font-size:14px">${esc(risk[0].n)}</b></div><div class="card"><span class="mt">Cheapest bite</span><br><b>${cheap.n}</b>about ₹${cheap.pr} per person</div></div>
<div class="fgrid">${F.map(f=>`<button class="fcard" data-act="go" data-k="${f[0]}"><b>${t(f[1])}</b><span class="mt">${f[2]}</span></button>`).join('')}</div>
<p class="mt" style="max-width:640px">Prototype built on sample Pune data. Scores, risk spots, prices, weather and traffic are illustrative, and citizen reports stay on your device.</p>`},

return `<h2>${t('Where to eat')}</h2><p class="sub">Affordable eats, cheapest first. Prices are rough per-person estimates (sample data).</p><div class="chips">${KS.map(k=>`<button class="chip ${S.ek===k?'on':''}" data-act="ek" data-k="${k}">${k==='all'?'All':k}</button>`).join('')}</div><label id="eml" for="em">Budget up to ₹${S.emax} per person</label><input type="range" id="em" min="30" max="400" step="10" value="${S.emax}" style="width:100%"><div style="height:10px"></div><div id="elist">${eatList()}</div>`},

function render(){const v=S.v;$('#nav').innerHTML=VIEWS.map(x=>`<button data-v="${x[0]}">${t(x[1])}</button>`).join('');$('#main').classList.toggle('wide',v==='compare'||v==='home');
document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.v===v));
$('#time').style.display=v==='compare'||v==='home'?'none':'flex';$('#hr').value=S.hr;$('#hrl').textContent=fmt(S.hr);

$('#hr').oninput=e=>{S.hr=+e.target.value;$('#hrl').textContent=fmt(S.hr);strip();drawMap();if(S.v!=='report')$('#side').innerHTML=PANEL[S.v]()};

async function aiGo(kind,id){if(!$('#ai'))return;let key,ctx;
if(kind==='walk'){const k=WK();key='walk'+S.walk+S.lang;ctx=`Heritage walk "${k.w.n}", ${k.km.toFixed(1)} km, ${k.min} min on foot. Stops in order: `+k.stops.map(p=>`${p.n} (${p.st}; safety at ${fmt(S.hr)}: ${pS(p,S.hr)}/100)`).join(' | ')}
else{const p=byId(id),near=hot().filter(h=>Math.hypot(h.x-p.x,h.y-p.y)<h.r*1.3).map(h=>h.n);key=p.id+S.lang+S.hr;ctx=`Place: ${p.n} (${CAT[p.c].l}, price level ${p.p}/3). Scores at ${fmt(S.hr)} (0-100): `+CRIT.map((c,i)=>c+' '+sc(p,S.hr)[i]).join(', ')+`. Safety at 2 PM: ${pS(p,14)}, at 10 PM: ${pS(p,22)}. Background: ${p.st}. Nearby reports: ${near.join('; ')||'none'}.`}
if(S.ai[key]){$('#ai').textContent=S.ai[key];return}
let sample=null;try{sample=window.claude?await claude.use('sample'):null}catch(e){}
